<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Joe Christ - Contact</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #1f2937;
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #8b5cf6;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .username {
            color: #a78bfa;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: white;
            background: #374151;
            padding: 15px;
            border-radius: 14px;
            margin: 12px 0;
            transition: 0.2s;
        }

        .button:hover {
            background: #4b5563;
            transform: translateY(-2px);
        }

        .save {
            background: #7c3aed;
        }

        .save:hover {
            background: #6d28d9;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Profile Photo -->
        <img
            class="profile"
            src="https://via.placeholder.com/120"
            alt="Profile Photo"
        >

        <!-- Name -->
        <h1>Pu Joe</h1>

        <div class="username">
            Personal Contact
        </div>

        <!-- Phone -->
        <a class="button" href="tel:+85560379000">
            📞 Call Me
        </a>

        <!-- Telegram -->
        <a class="button" href="https://t.me/fall9x">
            💬 Telegram
        </a>

        <!-- Email -->
        <a class="button" href="chhor.phikunda@gmail.com">
            📧 Email
        </a>

        <!-- Address -->
        <a class="button"
           href="https://www.google.com/maps"
           target="_blank">
            📍 My Location
        </a>

        <!-- Save Contact -->
        <a class="button save" href="#">
            📇 Save Contact
        </a>

        <div class="footer">
            Scan my QR code to contact me
        </div>

    </div>

</body>
</html>
